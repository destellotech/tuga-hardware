name = "tuga-hardware"
main = "src/worker.js"
compatibility_date = "2024-09-27"
compatibility_flags = ["nodejs_compat"]

# Static assets served from the project root (HTML, CSS, JS, images).
# run_worker_first: the worker must see every request so the canonical-host
# and legacy-URL redirects in src/worker.js actually fire; it then serves
# static files itself via the ASSETS binding. Unknown paths get /404.html
# with a 404 status from the worker (not_found_handling stays at its default).
assets = { directory = "./", binding = "ASSETS", run_worker_first = true }

[vars]
SITE_URL = "https://www.tugahardware.com"

# PayPal talks to the sandbox until this is "true". Only flip it once the
# PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET secrets hold LIVE credentials —
# live code with sandbox keys fails, and sandbox code with live keys sends
# customers to a checkout page they cannot pay on. While this is false the
# cart hides the PayPal button entirely and card checkout is the only option.
PAYPAL_LIVE = "true"
SITE_NAME = "Tuga Hardware"
# New-order alerts go to support@tugahardware.com. To send them elsewhere:
# ORDER_ALERT_EMAIL = "you@example.com"

# Daily at 09:00 UTC: email review requests for orders old enough to have
# been delivered and used (src/reviews.js).
[triggers]
crons = ["0 9 * * *"]

# KV namespace for order storage
[[kv_namespaces]]
binding = "ORDERS"
id = "dc341cf8ff2b4a2fb6f82c4be084bb7a"

# D1 database for the back-office records (customers, suppliers, purchases,
# sales, devices, movements). One table, `records`, keyed like KV; see
# src/store.js. Web orders and form submissions stay in the ORDERS KV above.
[[d1_databases]]
binding = "DB"
database_name = "tuga-backoffice"
database_id = "2487b310-f5b9-47c8-b552-dc982347133f"

# Rate limit for the public forms (src/api.js FORM_PATHS): 5 per minute per
# IP. Needs wrangler 4.36 or later; uncomment to switch it on. The code skips
# the check while the binding is absent.
# [[ratelimits]]
# name = "FORM_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 5
#   period = 60

# Secrets (set via CLI, never commit these):
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_CLIENT_SECRET
#   wrangler secret put PAYPAL_WEBHOOK_ID   (ID of the webhook for /webhooks/paypal in the PayPal developer dashboard)
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_TOKEN        (unlocks /api/*-check diagnostics)
