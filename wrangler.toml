name = "tuga-hardware"
main = "src/worker.js"
compatibility_date = "2024-09-27"
compatibility_flags = ["nodejs_compat"]

# Static assets served from the project root (HTML, CSS, JS, images).
# run_worker_first: the worker must see every request so the canonical-host
# and legacy-URL redirects in src/worker.js actually fire; it then serves
# static files itself via the ASSETS binding.
assets = { directory = "./", binding = "ASSETS", run_worker_first = true }

[vars]
SITE_URL = "https://www.tugahardware.com"

# PayPal talks to the sandbox until this is "true". Only flip it once the
# PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET secrets hold LIVE credentials —
# live code with sandbox keys fails, and sandbox code with live keys sends
# customers to a checkout page they cannot pay on. While this is false the
# cart hides the PayPal button entirely and card checkout is the only option.
PAYPAL_LIVE = "true"
SITE_NAME = "Tuga Hardware"

# KV namespace for order storage
[[kv_namespaces]]
binding = "ORDERS"
id = "dc341cf8ff2b4a2fb6f82c4be084bb7a"

# Secrets (set via CLI, never commit these):
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_CLIENT_SECRET
#   wrangler secret put RESEND_API_KEY
