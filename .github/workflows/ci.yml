name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Worker tests
        run: npm test

      - name: Build the site
        run: npm run build

      # Every page, the minified assets and the Worker's price list are
      # generated and committed. If a source changed without a rebuild, the
      # deployed site would not match the code, so fail here instead.
      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files are out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
