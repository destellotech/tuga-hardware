# Runs on every pull request and on main: rebuild the site and check that
# the committed output matches, every internal link resolves, and axe-core
# finds no accessibility violations. See build/check-site.mjs.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Pinned: ubuntu-latest became 26.04 in October 2026 and Playwright's
    # bundled Chromium has no build for it yet, so the install step fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # build.mjs dates each page from the last commit touching its
          # sources; a shallow clone would date everything "today".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm run test:unit
