# Runs on every pull request and on main: rebuild the site and check that
# the committed output matches, every internal link resolves, and axe-core
# finds no accessibility violations. See build/check-site.mjs.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
